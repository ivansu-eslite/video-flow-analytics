name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read   # 只需要 checkout；通知走 webhook，不用 GitHub 權杖

jobs:
  # 根層 tests/ 的文件契約測試。--no-project 是因為它的相依只有 pytest 與 pyyaml
  # （後者用來解析本檔），經 workspace 解析會為了跑文件檢查而 resolve 八十幾個
  # 套件、裝上 video_analyze 的 torch 依賴子樹。ruff 同理；根 pyproject.toml 沒有 [project] 區塊，
  # 但 [tool.ruff] 仍會被讀到（line-length 100、select E/F/I/W）。
  docs-contract:
    name: docs-contract (root tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv run --no-project --with pytest --with pyyaml pytest tests/
      - run: uv run --no-project --with ruff ruff check tests/

  # 四包中的三個 CPU-only 成員 + 三個共用 lib：pytest/ruff 一律用 --directory（切 cwd）
  # 而非 --package，避免從 repo 根遞迴收集撞名（四包都有 tests/test_config.py 等同名檔）。
  lint-test:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - zone_mapping
          - line_counting
          - flow_report
          - libs/vfa_registry
          - libs/vfa_observability
          - libs/vfa_config
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv run --directory ${{ matrix.pkg }} ruff check .
      - run: uv run --directory ${{ matrix.pkg }} pytest

  # video_analyze 獨立成一個 job：唯一含 torch/torchvision/ultralytics/tensorrt-cu12
  # 的成員，依賴子樹遠比其餘三包重，拆開才不會拖慢 matrix 裡的輕量套件、也讓快取
  # key（依 pyproject.toml/uv.lock 內容）不必與輕量套件混在一起輪替。
  video-analyze:
    name: video_analyze (torch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv run --directory video_analyze ruff check .
      - run: uv run --directory video_analyze pytest

  # 規則集只勾這一關。if: always() 不能拿掉：前面有一關紅時這關會被跳過，
  # 而 GitHub 把跳過的必過檢查當成通過。needs 要等於上面全部的 job，由
  # tests/test_docs_contract.py 對回本檔。skipped、cancelled 都算沒過：之後加的
  # job 若會被 if: 合法跳過，要在下面的 jq 放行那一關並寫理由，不然總結果會紅。
  ci-gate:
    name: CI 總結果
    needs: [docs-contract, lint-test, video-analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 只跑一個 jq；上限是怕 runner 卡住時佔著必過檢查
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)：\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then printf '沒過的關：\n%s\n' "$bad"; exit 1; fi
          echo "$(jq length <<<"$NEEDS") 關都過"

  notify-if-fail:
    name: CI 紅了發聊天室
    needs: [ci-gate]
    if: failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 一次 curl
    steps:
      - env:
          WEBHOOK: ${{ secrets.CI_CHAT_WEBHOOK_URL }}
          # 含 # 的值要整個包引號，不然 YAML 把 # 之後當註解，整支 workflow 失效
          WHERE: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "沒設 webhook（CI_CHAT_WEBHOOK_URL），這次不發"; exit 0; fi
          jq -n --arg t "vfa CI 紅了（$WHERE）：$RUN_URL" '{text: $t}' \
            | curl -fsS -X POST -H 'Content-Type: application/json; charset=UTF-8' --data @- "$WEBHOOK"
