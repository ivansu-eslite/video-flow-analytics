name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # 根層 tests/test_docs_contract.py：刻意不經 workspace 解析（--no-project），
  # 避免為了跑文件契約檢查而裝上 video_analyze 的 torch 依賴子樹。ruff 用同一招，
  # 根 pyproject.toml 沒有 [project] 區塊、不是可 uv run 的專案。
  docs-contract:
    name: docs-contract (root tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv run --no-project --with pytest pytest tests/
      - run: uv run --no-project --with ruff ruff check tests/

  # 四包中的三個 CPU-only 成員 + 三個共用 lib：pytest/ruff 一律用 --directory（切 cwd）
  # 而非 --package，避免從 repo 根遞迴收集撞名（四包都有 tests/test_config.py 等同名檔）。
  lint-test:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - zone_mapping
          - line_counting
          - flow_report
          - libs/vfa_registry
          - libs/vfa_observability
          - libs/vfa_config
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv run --directory ${{ matrix.pkg }} ruff check .
      - run: uv run --directory ${{ matrix.pkg }} pytest

  # video_analyze 獨立成一個 job：唯一含 torch/torchvision/ultralytics/tensorrt-cu12
  # 的成員，依賴子樹遠比其餘三包重，拆開才不會拖慢 matrix 裡的輕量套件、也讓快取
  # key（依 pyproject.toml/uv.lock 內容）不必與輕量套件混在一起輪替。
  video-analyze:
    name: video_analyze (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv run --directory video_analyze ruff check .
      - run: uv run --directory video_analyze pytest
