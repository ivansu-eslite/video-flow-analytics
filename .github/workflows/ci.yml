name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read   # 只需要 checkout

jobs:
  # 根層 tests/ 的文件契約與 CI 釘版測試。--only-group docs-contract 只裝根 pyproject.toml
  # 那一組相依（pytest、pyyaml、ruff），不裝四包，也就不裝 video_analyze 的 torch 依賴子樹；
  # --locked 讓 uv.lock 跟 pyproject.toml 對不上時直接紅，不自己重算版本照跑。
  # 根 pyproject.toml 的 [tool.ruff] 照樣會被讀到（line-length 100、select E/F/I/W）。
  docs-contract:
    name: docs-contract (root tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv run --locked --only-group docs-contract pytest tests/
      - run: uv run --locked --only-group docs-contract ruff check tests/

  # 四包中的三個 CPU-only 成員 + 三個共用 lib：pytest/ruff 一律用 --directory（切 cwd）
  # 而非 --package，避免從 repo 根遞迴收集撞名（四包都有 tests/test_config.py 等同名檔）。
  lint-test:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - zone_mapping
          - line_counting
          - flow_report
          - libs/vfa_registry
          - libs/vfa_observability
          - libs/vfa_config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv run --locked --directory ${{ matrix.pkg }} ruff check .
      - run: uv run --locked --directory ${{ matrix.pkg }} pytest

  # video_analyze 獨立成一個 job：唯一含 torch/torchvision/ultralytics/tensorrt-cu12
  # 的成員，依賴子樹遠比其餘三包重，拆開才不會拖慢 matrix 裡的輕量套件、也讓快取
  # key（依 pyproject.toml/uv.lock 內容）不必與輕量套件混在一起輪替。
  video-analyze:
    name: video_analyze (torch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv run --locked --directory video_analyze ruff check .
      - run: uv run --locked --directory video_analyze pytest

  # 規則集只勾這一關。if: always() 不能拿掉：前面有一關紅時這關會被跳過，
  # 而 GitHub 把跳過的必過檢查當成通過。needs 要等於上面全部的 job，由
  # tests/test_docs_contract.py 對回本檔。skipped、cancelled 都算沒過：之後加的
  # job 若會被 if: 合法跳過，要在下面的 jq 放行那一關並寫理由，不然總結果會紅。
  ci-gate:
    name: CI 總結果
    needs: [docs-contract, lint-test, video-analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 只跑一個 jq；上限是怕 runner 卡住時佔著必過檢查
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)：\(.value.result)"' <<<"$NEEDS")
          if [ -n "$bad" ]; then printf '沒過的關：\n%s\n' "$bad"; exit 1; fi
          echo "$(jq length <<<"$NEEDS") 關都過"
