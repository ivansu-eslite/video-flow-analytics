[input]
# bucket_dir／outputs 皆為 cwd 相對路徑：一律以
# `uv run --package line_counting line_counting` 在 repo 根執行（見 README）。
bucket_dir = "bucket_name1" # 本機模擬 GCS bucket 的根目錄
date = 2026-05-01           # 開發時指定的分析日期；正式呼叫端可直接以參數呼叫 count_lines_daily
# 進出人數統計的時段粒度（分鐘）。與 zone_mapping／flow_report 的同名欄位是同一個口徑，
# 三包要填一致的值（環境變數 INPUT__BUCKET_MINUTES 可一次覆寫全部）。
bucket_minutes = 60

[line]
# 跨越去抖的線段區域寬度，以 1080p（寬 1920）為基準的像素值：各攝影機依自己的
# frame_width 換算（3840 → 兩倍），故同一個值在不同解析度上代表同樣的實際距離。
# 0 = 細線純零交越（換算後仍是 0）；25 的由來與再調高的代價見 README「已知限制」。
crossing_band_px_1080p = 25
