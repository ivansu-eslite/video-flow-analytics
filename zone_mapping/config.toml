[input]
# bucket_dir／outputs 皆為 cwd 相對路徑：一律以
# `uv run --package zone_mapping zone_mapping` 在 repo 根執行（見 README）。
bucket_dir = "bucket_name1" # 本機模擬 GCS bucket 的根目錄
date = 2026-05-01           # 開發時指定的分析日期；正式呼叫端可直接以參數呼叫 map_zones_daily
# 人流統計的時段粒度（分鐘）。與 line_counting／flow_report 的同名欄位是同一個口徑，
# 三包要填一致的值（環境變數 INPUT__BUCKET_MINUTES 可一次覆寫全部）。
bucket_minutes = 60

[zone]
# entries 判定的線段區域寬度，以 1080p（寬 1920）為基準的像素；執行時依各攝影機
# 的 frame_width 換算（3840 → ×2）。0 = 純內外判定，調高可濾掉腳底點在邊界抖動的重複計數。
boundary_band_px_1080p = 25
