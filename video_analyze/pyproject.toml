[project]
name = "video_analyze"
version = "0.1.0"
description = "YOLO + ByteTrack multi-stream detection and tracking (GPU, multiprocess)"
readme = "README.md"
requires-python = ">=3.12"
# 版本 pin 成與 golden 產生時相同：影響偵測數值的推理堆疊
# （torch/torchvision/ultralytics/numpy/opencv）與輸出格式（polars/pyarrow）逐一
# 對齊，讓 golden 比對只反映「拆分是否改動邏輯」，排除函式庫版本漂移這個變數。
dependencies = [
    "av==18.1.0",
    "opencv-python==4.13.0.92",
    "pydantic==2.13.4",
    "pydantic-settings[toml]==2.14.2",
    "ultralytics==8.4.75",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "numpy==2.5.0",
    "pyyaml==6.0.3",
    "polars==1.42.0",
    "pyarrow==24.0.0",
    "lap==0.5.13",
    # 正式推論路徑是 TensorRT 引擎（ADR-011），故它是 runtime 依賴而非建置工具的
    # extra。可用版本帶是 **10.8 ～ 10.16**：sm120（開發機 RTX 5090）自 10.8.0 起才
    # 有 kernel，而 11.0.0 起 strongly-typed 成為預設、移除了 `BuilderFlag.FP16`，
    # FP16 改要靠額外的量化工具烤進中介格式（見 issue #110 第一則 comment）。帶內取
    # 已實測過的 10.13.3.9：其 `libnvinfer_builder_resource` 確認含 sm75（T4）與
    # sm120 兩組 kernel。**升版時要重跑那條 strings 檢查**——帶上緣（10.16.x）沒驗過。
    # `-cu12` 尾綴不可省：不加尾綴的 `tensorrt` 現在解析到 11.x 的 cu13 wheel。
    "tensorrt-cu12==10.13.3.9",
    "vfa_config",
    "vfa_observability",
    "vfa_registry",
]

[tool.uv.sources]
vfa_config = { workspace = true }
vfa_observability = { workspace = true }
vfa_registry = { workspace = true }

[project.scripts]
video_analyze = "video_analyze.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
