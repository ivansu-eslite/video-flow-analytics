[tool.uv]
# 新發佈未滿 7 天的版本當作不存在：套件發布權限被冒用、放上假版本的事件，
# 通常在一兩天內就被下架，取 7 天是留一倍以上的餘裕；急用剛發佈的修補版時，
# 只放寬那一個套件（寫法見 CLAUDE.md），不要拿掉這行。
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["video_analyze", "zone_mapping", "line_counting", "flow_report", "libs/*"]

[tool.ruff]
# 根層只有 tests/ 的文件契約測試；四包與 libs 各自帶設定，不受此處影響。
# 指定 target-version 是為了讓 isort 認得 tomllib 屬標準庫（3.11 起）——
# 根 pyproject 沒有 project 區塊可供推斷，預設會把它排進第三方組。
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 與四包一致；ruff 的預設規則集不含 I（import 排序）與 W，
# 不明寫的話 CI 會比本機寬鬆。
select = ["E", "F", "I", "W"]
