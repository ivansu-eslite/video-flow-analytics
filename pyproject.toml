[tool.uv.workspace]
members = ["video_analyze", "zone_mapping", "line_counting", "flow_report", "libs/*"]

[tool.ruff]
# 根層只有 tests/ 的文件契約測試；四包與 libs 各自帶設定，不受此處影響。
# 指定 target-version 是為了讓 isort 認得 tomllib 屬標準庫（3.11 起）——
# 根 pyproject 沒有 project 區塊可供推斷，預設會把它排進第三方組。
line-length = 100
target-version = "py312"
